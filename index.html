<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chess Clock">
<meta name="theme-color" content="#111111">
<title>Chess Clock</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; overflow: hidden; touch-action: manipulation; }
  #app { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .side { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #2b2b2b; transition: background .15s; position: relative; }
  .side.top { transform: rotate(180deg); }
  .side.active { background: #e8a33d; color: #111; }
  .side.low.active { background: #d9412b; color: #fff; }
  .side.flag { background: #8b0000 !important; color: #fff !important; }
  .time { font-size: 22vw; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1px; line-height: 1; }
  .meta { font-size: 4.2vw; opacity: .75; margin-top: 2vh; }
  .bar { display: flex; justify-content: space-around; align-items: center; background: #111; padding: 10px 6px; gap: 6px; }
  .bar button { flex: 1; background: #333; color: #fff; border: 0; border-radius: 12px; padding: 14px 4px; font-size: 16px; font-weight: 600; }
  .bar button:active { background: #555; }
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 10; }
  #sheet.open { display: flex; }
  .card { background: #1d1d1f; border-radius: 18px; padding: 20px; width: min(92vw, 420px); max-height: 90dvh; overflow: auto; }
  .card h2 { margin: 0 0 12px; font-size: 20px; }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .presets button, .card .row button { background: #333; color: #fff; border: 0; border-radius: 10px; padding: 12px 4px; font-size: 15px; font-weight: 600; }
  .presets button.sel { background: #e8a33d; color: #111; }
  label { display: block; font-size: 14px; opacity: .8; margin: 10px 0 4px; }
  input, select { width: 100%; font-size: 17px; padding: 10px; border-radius: 10px; border: 0; background: #2c2c2e; color: #fff; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .row button { flex: 1; }
  .row .go { background: #e8a33d !important; color: #111 !important; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hint { font-size: 12px; opacity: .6; margin-top: 12px; line-height: 1.4; }
</style>
</head>
<body>
<div id="app">
  <div class="side top" id="p1"><div class="time" id="t1">5:00</div><div class="meta" id="m1">Moves 0</div></div>
  <div class="bar">
    <button id="btnPause">Pause</button>
    <button id="btnReset">Reset</button>
    <button id="btnSettings">Settings</button>
    <button id="btnSound">Sound On</button>
  </div>
  <div class="side bottom" id="p2"><div class="time" id="t2">5:00</div><div class="meta" id="m2">Moves 0</div></div>
</div>

<div id="sheet">
  <div class="card">
    <h2>Time control</h2>
    <div class="presets" id="presets"></div>
    <div class="grid2">
      <div><label>Minutes</label><input id="inMin" type="number" inputmode="decimal" min="0" step="0.5" value="5"></div>
      <div><label>Increment (sec)</label><input id="inInc" type="number" inputmode="numeric" min="0" value="0"></div>
    </div>
    <label>Mode</label>
    <select id="inMode">
      <option value="fischer">Fischer (add increment after move)</option>
      <option value="bronstein">Bronstein (refund used time up to increment)</option>
      <option value="delay">Simple delay (clock waits before counting)</option>
    </select>
    <label><input id="inOdds" type="checkbox" style="width:auto"> Different time for top player</label>
    <div id="oddsBox" style="display:none">
      <div class="grid2">
        <div><label>Top minutes</label><input id="inMin1" type="number" inputmode="decimal" min="0" step="0.5" value="5"></div>
        <div><label>Top increment</label><input id="inInc1" type="number" inputmode="numeric" min="0" value="0"></div>
      </div>
    </div>
    <div class="row"><button id="btnCancel">Cancel</button><button class="go" id="btnApply">Start new game</button></div>
    <div class="hint">Tap your own side after you move to start your opponent's clock. Either player can tap first to begin. To install: Safari Share button, then Add to Home Screen.</div>
  </div>
</div>

<script>
(function () {
  const PRESETS = [
    ["1 min", 1, 0], ["1 | 1", 1, 1], ["2 | 1", 2, 1],
    ["3 min", 3, 0], ["3 | 2", 3, 2], ["5 min", 5, 0],
    ["5 | 3", 5, 3], ["10 min", 10, 0], ["10 | 5", 10, 5],
    ["15 | 10", 15, 10], ["30 min", 30, 0], ["90 | 30", 90, 30]
  ];
  const $ = id => document.getElementById(id);
  const saved = JSON.parse(localStorage.getItem("chessclock") || "{}");
  let cfg = Object.assign({ min: 5, inc: 0, mode: "fischer", odds: false, min1: 5, inc1: 0, sound: true }, saved);

  let time = [0, 0], moves = [0, 0], inc = [0, 0];
  let active = -1, running = false, flagged = -1, last = 0, turnStart = 0, turnUsed = 0, raf = 0;
  let audio = null, wakeLock = null;

  function save() { localStorage.setItem("chessclock", JSON.stringify(cfg)); }

  function newGame() {
    const top = cfg.odds ? [cfg.min1, cfg.inc1] : [cfg.min, cfg.inc];
    time = [top[0] * 60000, cfg.min * 60000];
    inc = [top[1] * 1000, cfg.inc * 1000];
    moves = [0, 0]; active = -1; running = false; flagged = -1; turnUsed = 0;
    cancelAnimationFrame(raf); releaseWake(); render();
    $("btnPause").textContent = "Pause";
  }

  function fmt(ms) {
    ms = Math.max(0, ms);
    if (ms < 10000) { const s = Math.floor(ms / 1000), t = Math.floor((ms % 1000) / 100); return s + "." + t; }
    const total = Math.ceil(ms / 1000), h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
  }

  function render() {
    [0, 1].forEach(i => {
      const el = $("p" + (i + 1));
      $("t" + (i + 1)).textContent = fmt(time[i]);
      $("m" + (i + 1)).textContent = flagged === i ? "Time's up" : "Moves " + moves[i];
      el.classList.toggle("active", active === i && flagged < 0);
      el.classList.toggle("low", time[i] < 20000);
      el.classList.toggle("flag", flagged === i);
    });
  }

  function tick(now) {
    if (!running) return;
    const dt = now - last; last = now;
    turnUsed += dt;
    let charge = dt;
    if (cfg.mode === "delay") {
      const before = turnUsed - dt, d = inc[active];
      charge = Math.max(0, turnUsed - Math.max(before, d));
    }
    time[active] -= charge;
    if (time[active] <= 0) { time[active] = 0; flagged = active; running = false; beep(220, 0.6); releaseWake(); }
    render();
    if (running) raf = requestAnimationFrame(tick);
  }

  function press(i) {
    if (flagged >= 0) return;
    unlockAudio();
    if (active === -1) { start(1 - i); return; }
    if (i !== active) return;
    if (!running) { resume(); return; }
    moves[i]++;
    if (cfg.mode === "fischer") time[i] += inc[i];
    if (cfg.mode === "bronstein") time[i] += Math.min(inc[i], turnUsed);
    beep(880, 0.05);
    start(1 - i);
  }

  function start(i) {
    active = i; running = true; turnUsed = 0; last = performance.now();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
    requestWake(); render(); $("btnPause").textContent = "Pause";
  }
  function pause() { if (!running) return; running = false; cancelAnimationFrame(raf); releaseWake(); render(); $("btnPause").textContent = "Resume"; }
  function resume() { if (active < 0 || flagged >= 0) return; running = true; last = performance.now(); raf = requestAnimationFrame(tick); requestWake(); $("btnPause").textContent = "Pause"; }

  function unlockAudio() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (audio && audio.state === "suspended") audio.resume();
  }
  function beep(freq, dur) {
    if (!cfg.sound || !audio) return;
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; g.gain.value = 0.15;
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  }
  async function requestWake() { try { if ("wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
  function releaseWake() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && running) { wakeLock = null; requestWake(); } });

  ["p1", "p2"].forEach((id, i) => $(id).addEventListener("touchstart", e => { e.preventDefault(); press(i); }, { passive: false }));
  ["p1", "p2"].forEach((id, i) => $(id).addEventListener("mousedown", () => press(i)));

  $("btnPause").onclick = () => running ? pause() : resume();
  $("btnReset").onclick = () => { if (active < 0 || confirm("Reset the clock?")) newGame(); };
  $("btnSound").onclick = () => { cfg.sound = !cfg.sound; save(); $("btnSound").textContent = cfg.sound ? "Sound On" : "Sound Off"; };
  $("btnSettings").onclick = () => { pause(); openSheet(); };
  $("btnCancel").onclick = () => $("sheet").classList.remove("open");
  $("inOdds").onchange = () => $("oddsBox").style.display = $("inOdds").checked ? "block" : "none";
  $("btnApply").onclick = () => {
    cfg.min = parseFloat($("inMin").value) || 0; cfg.inc = parseInt($("inInc").value) || 0;
    cfg.mode = $("inMode").value; cfg.odds = $("inOdds").checked;
    cfg.min1 = parseFloat($("inMin1").value) || 0; cfg.inc1 = parseInt($("inInc1").value) || 0;
    if (cfg.min <= 0 || (cfg.odds && cfg.min1 <= 0)) { alert("Minutes must be more than 0."); return; }
    save(); $("sheet").classList.remove("open"); newGame();
  };

  function openSheet() {
    $("inMin").value = cfg.min; $("inInc").value = cfg.inc; $("inMode").value = cfg.mode;
    $("inOdds").checked = cfg.odds; $("oddsBox").style.display = cfg.odds ? "block" : "none";
    $("inMin1").value = cfg.min1; $("inInc1").value = cfg.inc1;
    const box = $("presets"); box.innerHTML = "";
    PRESETS.forEach(([label, m, s]) => {
      const b = document.createElement("button"); b.textContent = label;
      if (m == cfg.min && s == cfg.inc) b.className = "sel";
      b.onclick = () => { $("inMin").value = m; $("inInc").value = s; [...box.children].forEach(c => c.className = ""); b.className = "sel"; };
      box.appendChild(b);
    });
    $("sheet").classList.add("open");
  }

  $("btnSound").textContent = cfg.sound ? "Sound On" : "Sound Off";
  newGame();
})();
</script>
</body>
</html>
